name: Skill Verification

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.claude/skills/**'
      - 'scripts/verify-*.py'
      - 'scripts/refresh-*.py'
      - 'scripts/command-registry.json'
      - 'scripts/api-surface.json'
      - 'scripts/url-registry.json'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CLI commands match ground-truth registry
        run: python3 scripts/verify-commands.py
      - name: Action API calls match ground-truth module surface
        run: python3 scripts/verify-api.py
      - name: AQS REST endpoints and parameter values match ground truth
        run: python3 scripts/verify-rest-enums.py
      - name: Links, depends_on, and URL registry status
        run: python3 scripts/verify-links.py
      - name: Code snippets are syntactically valid
        run: python3 scripts/verify-snippets.py
      - name: last_verified freshness
        run: python3 scripts/verify-freshness.py
      - name: mul default values requested wherever labels are read
        run: python3 scripts/verify-mul-labels.py
      - name: Install skill-asset dependencies
        # The guard step below executes every skill script with no arguments.
        # Without these deps (same set the tests job installs) 22 of 142 scripts
        # die on `import requests`/`mwparserfromhell` and are reported as "not
        # exercised" instead of actually being checked. pywikibot is not in
        # requirements.txt (it belongs to the pywikibot skill) but one guarded
        # script imports it.
        run: python3 -m pip install -r requirements.txt pywikibot
      - name: Skill scripts refuse to do work when invoked with no arguments
        run: python3 scripts/verify-script-guards.py
