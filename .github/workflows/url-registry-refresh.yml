name: URL Registry Refresh
on:
  schedule:
    # Weekly on Tuesday at 07:00 UTC — keep the URL registry fresh without
    # blocking commits: each run only re-checks URLs outside the freshness
    # window (default 90 days) plus new URLs, so runs are small and bounded.
    - cron: '0 7 * * 2'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write        # push the bot branch
  pull-requests: write   # open/update the refresh PR

jobs:
  refresh-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Authenticate the push with the same credential that opens the PR. Without
          # this, the weekly force-push is a GITHUB_TOKEN event and GitHub parks the
          # resulting `synchronize` runs as action_required — so the PR would be yours
          # while its checks still waited for a manual approval.
          token: ${{ secrets.REGISTRY_REFRESH_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Incremental URL refresh (freshness rotation)
        run: python3 scripts/refresh-url-registry.py
        env:
          WIKIMEDIA_USER_AGENT: wikipedia-ai-skills-url-registry/1.0 (scheduled GitHub Action; https://github.com/fuzheado/Wikipedia-AI-Skills)

      - name: Open a pull request with the refreshed registry
        # main is branch-protected (6 required checks), so a direct push by the bot is
        # rejected with GH006. That failed this workflow every week from 2026-08-25 to
        # 2026-09-29 while the registry quietly stopped being refreshed: the commit was
        # made and then discarded by the rejected push. Push a bot branch and open a
        # PR for it instead.
        #
        # Opening that PR needs one of two things, because this repository has
        # can_approve_pull_request_reviews = false (Actions may not create PRs):
        #   1. Settings -> Actions -> General -> Workflow permissions ->
        #      "Allow GitHub Actions to create and approve pull requests"
        #   2. the REGISTRY_REFRESH_TOKEN secret: a fine-grained PAT with contents:
        #      write + pull-requests: write. This is the better option, because a PR
        #      authored by a real actor DOES trigger CI, so its checks report and it
        #      becomes mergeable on its own. When set, it also authenticates checkout,
        #      so the push is that actor's too and nothing is parked for approval.
        # Without either, the branch is still pushed and the run fails with a message
        # naming the setting, so the failure is actionable instead of a GH006 puzzle.
        #
        # When the PR exists, auto-merge is armed on it so the refresh lands by itself.
        env:
          GH_TOKEN: ${{ secrets.REGISTRY_REFRESH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet scripts/url-registry.json; then
            echo "Registry unchanged — nothing to commit."
            exit 0
          fi

          BRANCH="bot/url-registry-refresh"
          COMPARE="https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/url-registry.json
          git commit -m "chore(links): refresh url-registry (incremental freshness run)"

          # The branch is bot-owned and single-writer, so replace it each run and keep
          # one open PR rather than accumulating them.
          git push --force origin "HEAD:refs/heads/${BRANCH}"

          CHANGED=$(git show --stat --format='' HEAD | tail -n 2 | sed 's/^ *//')
          BODY=$(mktemp)
          {
            echo 'The scheduled freshness run changed `scripts/url-registry.json`.'
            echo
            echo '```'
            echo "${CHANGED}"
            echo '```'
            echo
            echo 'Opened by `.github/workflows/url-registry-refresh.yml`. A PR authored with the'
            echo 'default `GITHUB_TOKEN` does not trigger CI, so its checks will not report: merge'
            echo 'it directly (`enforce_admins` is off on main), or set `REGISTRY_REFRESH_TOKEN`'
            echo 'for a loop whose checks do run.'
          } > "${BODY}"

          if gh pr list --head "${BRANCH}" --state open --json number --jq '.[].number' | grep -q .; then
            echo "Updated the pull request already open for ${BRANCH}."
          elif ERR=$(gh pr create --base main --head "${BRANCH}" \
                       --title "chore(links): refresh the URL registry" \
                       --body-file "${BODY}" 2>&1); then
            echo "Opened a pull request for ${BRANCH}."
          else
            echo "::error title=Refreshed registry needs a merge::Could not open a PR: ${ERR}"
            echo "  Nothing is lost — the refreshed registry is on the ${BRANCH} branch."
            echo "  Review and merge it here: ${COMPARE}"
            echo "  To let Actions open the PR itself, either enable"
            echo "    Settings -> Actions -> General -> Workflow permissions ->"
            echo "    'Allow GitHub Actions to create and approve pull requests'"
            echo "  or set the REGISTRY_REFRESH_TOKEN secret (fine-grained PAT with"
            echo "  contents: write + pull-requests: write)."
            exit 1
          fi

          # Let it merge itself once the checks pass, so a weekly refresh needs nobody.
          # --merge (not --squash) to match this repo's history: every other PR here
          # landed as "Merge pull request #N from ...".
          #
          # Arming auto-merge needs the repository's "Allow auto-merge" setting. If that
          # is off the PR is still open and mergeable by hand, so this is a warning
          # rather than an error: the deliverable exists.
          if gh pr view "${BRANCH}" --json autoMergeRequest --jq '.autoMergeRequest != null' | grep -q '^true$'; then
            echo "Auto-merge already armed for ${BRANCH}."
          elif ARM_ERR=$(gh pr merge "${BRANCH}" --auto --merge 2>&1); then
            echo "Armed auto-merge — this PR merges itself when its checks pass."
          else
            echo "::warning title=Auto-merge not armed::${ARM_ERR}"
            echo "  The PR is open; merge it by hand when the checks are green: ${COMPARE}"
          fi
